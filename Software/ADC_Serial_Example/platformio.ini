[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 1000000L
upload_protocol = avrisp
upload_speed = 19200
monitor_speed = 9600

; If using Arduino as ISP programmer (ICSP)
upload_port = COM3
; Change COM3 to your Arduino's COM port

; Optional: Program fuses for ATtiny85
; board_fuses.lfuse = 0x62
; board_fuses.hfuse = 0xdf
; board_fuses.efuse = 0xff

lib_deps = 
    SoftwareSerial
