xml version=1.0 encoding=UTF-8 standalone=no
svg
   xmlns=httpwww.w3.org2000svg
   width=85mm height=25mm
   viewBox=0 0 850 250
   version=1.1
   id=directional_coupler_single_side
  !-- Scale used 10 px = 1 mm (viewBox 850 x 250 - 85 mm x 25 mm) --
  rect x=1 y=1 width=848 height=248 fill=none stroke=#000000 stroke-width=2
  text x=10 y=18 font-family=Arial font-size=12 fill=#000Single‑side 4‑section coupler — top copper (reference)text
  text x=10 y=34 font-family=Arial font-size=11 fill=#000Board 85.0 mm × 25.0 mm. Center f = 2.445 GHz. 4x quarter‑wave sections (4 × 17.08 mm).text
  text x=10 y=48 font-family=Arial font-size=11 fill=#000Main trace w50 = 1.15 mm  Coupled trace Wc = 1.05 mm  Gap G = 0.30 mmtext

  !-- Coupled region (starts at x = 100 px = 10 mm) --
  g id=coupled_region
    !-- section boundaries --
    line x1=100 y1=40 x2=100 y2=210 stroke=#666 stroke-width=1 stroke-dasharray=2,2
    line x1=270.8 y1=40 x2=270.8 y2=210 stroke=#666 stroke-width=1 stroke-dasharray=2,2
    line x1=441.6 y1=40 x2=441.6 y2=210 stroke=#666 stroke-width=1 stroke-dasharray=2,2
    line x1=612.4 y1=40 x2=612.4 y2=210 stroke=#666 stroke-width=1 stroke-dasharray=2,2

    !-- main microstrip (single) --
    rect x=100 y=117 width=683.2 height=11.5 fill=#0077cc stroke=#004477 stroke-width=0.5
    !-- single coupled trace on the top side only --
    rect x=100 y=102 width=683.2 height=10.5 fill=#cc0000 stroke=#660000 stroke-width=0.5
  g

  !-- Left and right 50Ω tapers and edge SMAs --
  path d=M 0 120.75 L 100 120.75 L 100 117 L 0 117 Z fill=#0077cc stroke=#004477 stroke-width=0.5
  path d=M 783.2 120.75 L 850 120.75 L 850 117 L 783.2 117 Z fill=#0077cc stroke=#004477 stroke-width=0.5

  !-- Edge SMA pads --
  rect x=0 y=102 width=15 height=46 fill=#f2c94c stroke=#b88600 stroke-width=0.7
  rect x=835 y=102 width=15 height=46 fill=#f2c94c stroke=#b88600 stroke-width=0.7
  text x=2 y=98 font-family=Arial font-size=10 fill=#000SMAtext
  text x=818 y=98 font-family=Arial font-size=10 fill=#000SMAtext

  !-- Via stitching markers near coupled region --
  g fill=#000
    circle cx=90 cy=70 r=3
    circle cx=90 cy=120 r=3
    circle cx=90 cy=170 r=3
    circle cx=760 cy=70 r=3
    circle cx=760 cy=120 r=3
    circle cx=760 cy=170 r=3
  g
  text x=70 y=58 font-family=Arial font-size=9 fill=#000GND vias (stitch)text

  !-- Detector area on right one detector for forward-sample --
  rect x=680 y=20 width=140 height=60 fill=#f0f0f0 stroke=#333 stroke-width=0.6
  text x=750 y=36 font-family=Arial font-size=10 fill=#000 text-anchor=middleDetector areatext
  text x=750 y=50 font-family=Arial font-size=9 fill=#000 text-anchor=middleAD8318 suggested (single channel)text

  !-- Detector pads --
  rect x=700 y=32 width=12 height=8 fill=#d0ffd0 stroke=#0a0 
  text x=717 y=38 font-family=Arial font-size=8 fill=#000VCC 3.3Vtext
  rect x=730 y=32 width=12 height=8 fill=#ffd0d0 stroke=#a00
  text x=747 y=38 font-family=Arial font-size=8 fill=#000GNDtext
  rect x=760 y=32 width=30 height=8 fill=#fff2b0 stroke=#b88600
  text x=775 y=38 font-family=Arial font-size=8 fill=#000RF IN (coupled)text
  rect x=800 y=32 width=30 height=8 fill=#e0e0e0 stroke=#666
  text x=815 y=38 font-family=Arial font-size=8 fill=#000ADC OUTtext

  !-- Dimension note --
  line x1=100 y1=215 x2=783.2 y2=215 stroke=#000 stroke-width=1
  text x=420 y=233 font-family=Arial font-size=11 fill=#000 text-anchor=middleCoupled length = 68.32 mm (4 × 17.08 mm)text
  text x=420 y=200 font-family=Arial font-size=11 fill=#000 text-anchor=middleWc = 1.05 mm  G = 0.30 mm  w50 = 1.15 mmtext

  !-- Legend --
  rect x=10 y=200 width=200 height=40 fill=#ffffff stroke=#000 stroke-width=0.5
  text x=18 y=216 font-family=Arial font-size=10 fill=#000Legendtext
  rect x=18 y=222 width=12 height=6 fill=#cc0000 stroke=#660000
  text x=36 y=227 font-family=Arial font-size=10 fill=#000Single coupled tracetext
  rect x=110 y=222 width=12 height=6 fill=#0077cc stroke=#004477
  text x=130 y=227 font-family=Arial font-size=10 fill=#00050Ω main tracetext
svg